[project]
# Not published or pip-installed as a library: the plugin package is bind-mounted
# into Atlas's backend at runtime, and its runtime deps come from the Atlas
# backend image + backend_plugins/requirements.txt (installed by the plugin
# seam). This pyproject defines only the local dev/test environment — hence no
# [project].dependencies; see [dependency-groups] below.
name = "rag-showcase"
version = "0.1.0"
description = "Seven-approach RAG comparison showcase over Atlas"
license = "Apache-2.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["backend_plugins", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"  # pin per-test loops; avoid pytest-asyncio's unset-default ambiguity
testpaths = ["backend_plugins/rag/tests", "tests"]

[tool.ruff]
# infra/ is the vendored Atlas submodule — not ours to lint or modify.
extend-exclude = ["infra"]
# `ruff check` is the lint gate. `ruff format` is deliberately NOT adopted: the
# repo's compact hand-wrapped style (long lines to ~116 cols, no blank line after
# module docstrings) is intentional, and a one-time reformat would be a ~2,100-line
# noise diff. Do not run `ruff format` here.

[tool.ruff.lint.per-file-ignores]
# Tests use the compact `app = FastAPI(); app.include_router(...)` setup idiom
# consistently across the suite; accept E702 (multiple statements on one line)
# there. Kept active for non-test code, where a semicolon is a real smell.
"**/tests/*.py" = ["E702"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "httpx>=0.27", "pyyaml>=6", "fastapi>=0.110,<0.137", "pydantic>=2", "ruff==0.9.10", "coverage>=7", "radon>=6"]
# coverage and radon: not invoked by any make target (no CI/local command
# depends on them), but the overnight-maintenance loop's §3.13/§3.30 sweeps
# use both — undeclared, `uv run coverage`/`uv run radon` silently fell
# through to whatever same-named binary happened to be on PATH (a stale
# pyenv-global install here), producing a bogus collection-error/23% result
# instead of the real ~90%. Declaring them makes `uv run` resolve the
# project's locked venv copy deterministically.
# ruff is exact-pinned (unlike the floor-only pins above): every prior maintenance
# pass validated the tree clean against 0.9.10's default rule set specifically: a
# newer default (0.16.0 expands the default select, e.g. picking up I/isort) would
# fail CI on this same tree with 150+ new findings that are a real, separate cleanup
# effort, not a config bug. Bump deliberately, with the resulting diff reviewed.
# Docs surfaces (repo markdown -> generated MkDocs site + generated GitHub wiki).
# Build/check locally with: make docs-check
docs = ["mkdocs-material>=9.5,<10", "mkdocs-include-markdown-plugin>=6,<8", "pyyaml>=6", "cairosvg>=2.7"]
