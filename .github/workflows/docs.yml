name: Docs (three surfaces)

# Validate the canonical docs, generate the MkDocs site and wiki surfaces, publish
# Pages and the GitHub wiki from the default branch. Main-branch publication fails
# explicitly when the required wiki deploy key is unavailable.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Workflow-level token: read-only. Publish jobs request their own scoped
# permissions, while PR validation only builds generated docs locally.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install native diagram renderer deps
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Check generated docs
        run: |
          uv sync --group docs --dev
          make docs-check
      - name: Run Python tests
        run: make test
      - name: Lint (ruff)
        run: make lint
      - name: Run sortable-table interaction tests
        run: make sortable-tables-test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publish only from the default branch, after a successful build.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  wiki:
    # Wiki publication is independent from Pages, but both are required on main so
    # a stale wiki cannot masquerade as a successful three-surface release.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIKI_DEPLOY_KEY: ${{ secrets.WIKI_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require wiki deploy key
        run: |
          if [ -z "$WIKI_DEPLOY_KEY" ]; then
            echo "::error::WIKI_DEPLOY_KEY is required for main-branch wiki publication."
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install native diagram renderer deps
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Configure wiki deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$WIKI_DEPLOY_KEY" > ~/.ssh/wiki_key
          chmod 600 ~/.ssh/wiki_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/wiki_key
            IdentitiesOnly yes
          EOF
      - name: Publish generated wiki
        run: |
          uv sync --group docs --dev
          uv run --no-sync python -m scripts.docs.push_wiki --push
