# Local-first role→model map. Values MUST match a model name Atlas's LiteLLM
# actually registers. This map uses the two Ollama models selected explicitly by
# atlas.consumer.yml: qwen3.8:latest (chat; registered as `qwen3.8:latest`, not
# bare `qwen3.8`) and nomic-embed-text (embeddings). Atlas also catalogs
# qwen3-embedding:0.6b, but this showcase does not select it by default. Flip any
# value to a cloud model (e.g. claude-sonnet-4-6) once a key is configured, or activate more local
# models via start.sh's --ollama-models and name them here exactly (tag included).
embed: nomic-embed-text
light_gen: qwen3.8:latest
contextual_blurb: qwen3.8:latest
extraction: qwen3.8:latest   # LightRAG's extraction LLM is set Atlas-side; indicative only, not read by this plugin
agentic: qwen3.8:latest
