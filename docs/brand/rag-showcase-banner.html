<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Showcase brand banner</title>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      width: 1800px;
      height: 600px;
      margin: 0;
      overflow: hidden;
      background: #020711;
    }
    .banner {
      position: relative;
      width: 1800px;
      height: 600px;
      overflow: hidden;
      background: #020711;
    }
    .banner img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .banner::after {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(103, 232, 249, 0.2);
      content: "";
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="banner">
    <img
      src="rag-showcase-banner-art.png"
      alt="Seven retrieval paths converging through document, vector, and graph structures into one measured comparison"
    >
  </main>
</body>
</html>
